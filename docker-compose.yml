services:
  pi-telegram-monitor:
    build: .
    container_name: pi-telegram-monitor
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
      DIRECTO_1_URL: ${DIRECTO_1_URL}
      DIRECTO_2_URL: ${DIRECTO_2_URL}
      URL_CHECK_TIMEOUT: ${URL_CHECK_TIMEOUT:-8}

      BROWSER_CONTROL_URL: http://host.docker.internal:8765/action
      BROWSER_CONTROL_TOKEN: ${BROWSER_CONTROL_TOKEN}
