services:
  pi-telegram-monitor:
    build: .
    container_name: pi-telegram-monitor
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
      DIRECTO_1_URL: ${DIRECTO_1_URL}
      DIRECTO_2_URL: ${DIRECTO_2_URL}
      URL_CHECK_TIMEOUT: ${URL_CHECK_TIMEOUT:-8}
